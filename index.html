<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Faizy Mart | فیضی مارٹ</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  /* آپ کی ویب سائٹ کا سارا ڈیزائن یہاں ہے */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --primary-yellow: #facc15; --dark-bg: #111827; --card-bg: #1f2937; --text-light: #f3f4f6; --text-muted: #9ca3af; }
  body { font-family: "Noto Nastaliq Urdu", sans-serif; background: var(--dark-bg); color: var(--text-light); line-height: 1.9; min-height: 100vh; display: flex; flex-direction: column; }
  
  .top-strip { background: var(--primary-yellow); color: #000; padding: 8px 20px; display: flex; justify-content: space-between; align-items: center; font-size: 14px; font-weight: bold; }
  .main-header { background: #000; border-bottom: 2px solid var(--primary-yellow); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
  .main-header .logo { display: flex; align-items: center; gap: 10px; cursor: pointer; }
  .main-header .logo .logo-img { width: 55px; height: 55px; border-radius: 50%; border: 2px solid var(--primary-yellow); background: var(--primary-yellow); display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: bold; color: #000; }
  .main-header .logo span { font-size: 24px; color: var(--primary-yellow); font-weight: 900; }
  .main-header .logo span b { color: #fff; }
  .main-header .nav-links { display: flex; gap: 20px; }
  .main-header .nav-links a { color: var(--text-light); text-decoration: none; font-weight: bold; cursor: pointer; }
  .main-header .header-icons { display: flex; gap: 15px; }
  .main-header .header-icons button { background: transparent; border: none; color: var(--text-light); font-size: 22px; cursor: pointer; }

  .hero-section { display: flex; flex-wrap: wrap; background: var(--card-bg); margin: 20px; border-radius: 15px; overflow: hidden; border: 1px solid #333; }
  .hero-text { flex: 1; padding: 50px 40px; display: flex; flex-direction: column; justify-content: center; }
  .hero-text h1 { font-size: 40px; color: var(--text-light); margin-bottom: 10px; }
  .hero-text h1 span { color: var(--primary-yellow); }
  .hero-text button { padding: 12px 30px; background: var(--primary-yellow); color: #000; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; align-self: flex-start; font-family: inherit; }
  .hero-image { flex: 1; background: #000; }
  .hero-image img { width: 100%; height: 100%; object-fit: cover; }

  .sidebar { position: fixed; top: 0; right: -300px; width: 300px; height: 100vh; background: #000; border-left: 2px solid var(--primary-yellow); z-index: 1000; transition: right 0.3s ease; padding: 20px; }
  .sidebar.open { right: 0; }
  .sidebar .tab-btn { display: block; width: 100%; padding: 12px; margin-bottom: 8px; background: transparent; color: var(--text-light); border: none; border-radius: 8px; text-align: right; font-family: inherit; font-size: 15px; cursor: pointer; }
  .sidebar .admin-only, .sidebar .sub-admin-only, .sidebar .super-only, .admin-only { display: none !important; }
  body.is-sub-admin .sidebar .sub-admin-only { display: block !important; }
  body.is-super-admin .sidebar .admin-only, body.is-super-admin .sidebar .super-only { display: block !important; }
  body.is-super-admin .sidebar .customer-only, body.is-sub-admin .sidebar .customer-only { display: none !important; }

  .tab-content { display: none; padding: 20px; max-width: 1200px; margin: 0 auto; flex: 1; width: 100%; }
  .tab-content.active { display: block; }
  h2 { margin-bottom: 20px; color: var(--primary-yellow); text-align: center; }
  .back-btn { background: #333; color: var(--primary-yellow); border: none; padding: 8px 16px; border-radius: 20px; margin-bottom: 20px; cursor: pointer; font-family: inherit; }
  
  .category-grid, .product-list, .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; margin-top: 20px; }
  .cat-card { position: relative; border-radius: 15px; overflow: hidden; cursor: pointer; border: 2px solid #333; height: 250px; }
  .cat-card img { width: 100%; height: 100%; object-fit: cover; }
  .cat-card .cat-overlay { position: absolute; bottom: 0; width: 100%; background: linear-gradient(transparent, rgba(0,0,0,0.9)); padding: 20px; text-align: center; }
  .cat-card h3 { color: var(--primary-yellow); font-size: 20px; }
  .cat-card.abaya-card { background: linear-gradient(135deg, #1a1a1a, #333); display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .cat-card.abaya-card .abaya-shape { width: 80px; height: 120px; background: #000; border-radius: 40px 40px 10px 10px; }

  .product-item { background: var(--card-bg); border-radius: 12px; border: 1px solid #333; display: flex; flex-direction: column; position: relative; }
  .product-img-box { width: 100%; height: 200px; background: #000; overflow: hidden; }
  .product-img-box img { width: 100%; height: 100%; object-fit: cover; }
  .product-info { padding: 15px; }
  .product-item h4 { color: var(--text-light); margin-bottom: 5px; }
  .product-item .price { color: var(--primary-yellow); font-weight: 700; font-size: 18px; }
  .order-btn { width: 100%; margin-top: 10px; padding: 10px; background: var(--primary-yellow); color: #000; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-family: inherit; }
  
  .delete-prod-btn { position: absolute; top: 10px; right: 10px; background: rgba(239, 68, 68, 0.9); color: white; border: none; border-radius: 50%; width: 35px; height: 35px; cursor: pointer; z-index: 10; }

  form { max-width: 700px; background: var(--card-bg); padding: 25px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #333; }
  form label { display: block; margin-bottom: 15px; font-weight: 600; color: var(--primary-yellow); }
  form input { width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #444; border-radius: 8px; background: #111; color: var(--text-light); }
  form button { width: 100%; padding: 14px; background: var(--primary-yellow); color: #000; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; font-family: inherit; }

  table { width: 100%; border-collapse: collapse; background: var(--card-bg); border-radius: 10px; overflow: hidden; margin-bottom: 20px; }
  th, td { padding: 12px; text-align: right; border-bottom: 1px solid #333; }
  th { background: #000; color: var(--primary-yellow); }

  .hidden-login-box { display: none; max-width: 400px; margin: 40px auto; background: var(--card-bg); padding: 30px; border-radius: 15px; border: 2px solid var(--primary-yellow); text-align: center; }
  .hidden-login-box.show { display: block; }
  .hidden-login-box input { width: 100%; padding: 12px; margin-bottom: 12px; border: 1px solid #444; border-radius: 8px; background: #111; color: #fff; }
  .hidden-login-box button { width: 100%; padding: 12px; background: var(--primary-yellow); color: #000; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }

  .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 999; }
  .overlay.show { display: block; }

  footer { background: #000; border-top: 2px solid var(--primary-yellow); padding: 40px 20px; margin-top: 40px; text-align: center; }
</style>
</head>
<body>

<div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

<div class="top-strip">
  <div>Cash on Delivery All Over Pakistan</div>
  <div onclick="toggleSidebar()" style="cursor:pointer;">☰</div>
</div>

<div class="main-header">
  <div class="logo" onclick="handleLogoClick()">
    <div class="logo-img">F</div>
    <span>Faizy <b>Mart</b></span>
  </div>
  <div class="nav-links">
    <a onclick="showTab('home')">ہوم</a>
  </div>
  <div class="header-icons">
    <button onclick="showEmpLogin()">👤</button>
    <button onclick="toggleSidebar()">🛒</button>
  </div>
</div>

<aside class="sidebar" id="sidebar">
  <button class="tab-btn customer-only" onclick="showTab('home')">🏠 ہوم</button>
  <button class="tab-btn customer-only" onclick="showHiddenLogin()">🔐 ایڈمن لاگ ان</button>
  <button class="tab-btn admin-only" onclick="showTab('addEmployee')">➕ نیا ایمپلائی</button>
  <button class="tab-btn admin-only" onclick="showTab('orders')">🧾 تمام آرڈرز</button>
  <button class="tab-btn admin-only" onclick="adminLogout()">🚪 لاگ آؤٹ</button>
</aside>

<section id="home" class="tab-content active">
  <div class="hero-section">
    <div class="hero-text">
      <h1>Everything You Love,<br><span>All in One Place</span></h1>
      <button onclick="document.getElementById('categories').scrollIntoView({behavior: 'smooth'})">Shop Now</button>
    </div>
    <div class="hero-image">
      <img src="https://images.unsplash.com/photo-1596461404969-9ae70f2830c1?auto=format&fit=crop&w=1000&q=80" alt="Store">
    </div>
  </div>

  <div id="categories" style="margin-top: 40px;">
    <h2>Shop by Category</h2>
    <div class="category-grid">
      <div class="cat-card" onclick="openCategory('TOYS')"><img src="https://images.unsplash.com/photo-1559454403-b8fb88521f11?auto=format&fit=crop&w=500&q=80"><div class="cat-overlay"><h3>TOYS</h3></div></div>
      <div class="cat-card" onclick="openCategory('GADGETS')"><img src="https://images.unsplash.com/photo-1526738549149-8e07eca6c147?auto=format&fit=crop&w=500&q=80"><div class="cat-overlay"><h3>GADGETS</h3></div></div>
      <div class="cat-card abaya-card" onclick="openCategory('ABAYAS')"><div class="abaya-shape"></div><div class="cat-overlay"><h3>ABAYAS</h3></div></div>
    </div>
  </div>
</section>

<section id="categoryDetail" class="tab-content">
  <button class="back-btn" onclick="showTab('home')">← واپس جائیں</button>
  <div style="display:flex; justify-content:space-between;">
    <h2 id="catHeaderTitle">DRONES</h2>
    <button class="admin-only" onclick="openAddProductModal()" style="padding:10px; background:var(--primary-yellow); border:none; border-radius:8px; font-weight:bold;">➕ نیا آئٹم</button>
  </div>
  
  <form id="addProductForm" style="display:none;">
    <button class="back-btn" type="button" onclick="closeAddProductModal()">← واپس</button>
    <input type="hidden" id="prodCat" />
    <label>نام <input type="text" id="prodName" required /></label>
    <label>تفصیل <input type="text" id="prodDesc" required /></label>
    <label>قیمت <input type="number" id="prodPrice" required /></label>
    <label>تصویر <input type="file" id="prodImg1" accept="image/*" /></label>
    <button type="submit" style="background:#4ade80;">محفوظ</button>
  </form>
  <div class="product-list" id="productList"></div>
</section>

<section id="orders" class="tab-content">
  <button class="back-btn" onclick="showTab('home')">← واپس جائیں</button>
  <h2>تمام آرڈرز</h2>
  <table id="ordersTable"><thead><tr><th>آرڈر</th><th>کسٹمر</th><th>پروڈکٹ</th><th>رقم</th></tr></thead><tbody></tbody></table>
</section>

<section id="hiddenLoginSection" class="tab-content">
  <div class="hidden-login-box" id="hiddenLoginBox">
    <h2>🔐 ایڈمن لاگ ان</h2>
    <input type="email" id="hiddenLoginId" placeholder="فیضان رضا" />
    <input type="password" id="hiddenLoginPass" placeholder="المدار 313" />
    <button onclick="submitHiddenLogin()">لاگ ان</button>
    <button style="background:#444; margin-top:5px;" onclick="showTab('home')">منسوخ</button>
  </div>
</section>

<footer>
  <h3 style="color:var(--primary-yellow);">FAIZY MART</h3>
  <p style="color:#9ca3af; margin-top:10px;">© 2026, Faizy Mart. All rights reserved.</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
<script>
window.addEventListener('DOMContentLoaded', () => {
  let supabase = null;
  try {
    if (window.supabase) {
      supabase = window.supabase.createClient('https://ofjlswkrdrpwapcvwzun.supabase.co', 'sb_publishable_yk51b9Pps15BXSX-tmnBdw_IFsWoUCW');
    }
  } catch (e) {}

  let CATALOG = { "TOYS": [], "GADGETS": [], "ABAYAS": [] };
  let currentAdmin = null;
  let currentCategory = "";

  async function loadFromSupabase() {
    if (!supabase) return;
    try {
      const { data, error } = await supabase.from('store').select('data').eq('id', 1).single();
      if (data && data.data && data.data.CATALOG) {
        CATALOG = data.data.CATALOG;
        renderAll();
        console.log("✅ Supabase سے ڈیٹا لوڈ ہو گیا");
      }
    } catch (e) {}
  }

  async function saveToSupabase() {
    if (!supabase) return;
    try {
      await supabase.from('store').upsert({ id: 1, data: { CATALOG } });
      console.log("☁️ Supabase میں محفوظ");
    } catch (e) {}
  }

  function compressImage(file) {
    return new Promise((resolve) => {
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = event => {
        const img = new Image();
        img.src = event.target.result;
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const MAX = 600;
          let width = img.width, height = img.height;
          if (width > height) { if (width > MAX) { height *= MAX / width; width = MAX; } } 
          else { if (height > MAX) { width *= MAX / height; height = MAX; } }
          canvas.width = width; canvas.height = height;
          canvas.getContext('2d').drawImage(img, 0, 0, width, height);
          resolve(canvas.toDataURL('image/jpeg', 0.6));
        };
      };
    });
  }

  window.toggleSidebar = () => document.getElementById("sidebar").classList.toggle("open") || document.getElementById("overlay").classList.toggle("show");
  
  window.showTab = (name) => {
    document.querySelectorAll(".tab-content").forEach(s => s.classList.remove("active"));
    if (document.getElementById(name)) document.getElementById(name).classList.add("active");
    document.getElementById("sidebar").classList.remove("open");
    document.getElementById("overlay").classList.remove("show");
  };

  window.handleLogoClick = () => { if (!currentAdmin) showTab("hiddenLoginSection"); };
  
  window.submitHiddenLogin = () => {
    if (document.getElementById("hiddenLoginId").value === "فیضان رضا" && document.getElementById("hiddenLoginPass").value === "المدار 313") {
      currentAdmin = true;
      document.body.classList.add("is-super-admin");
      showTab('home');
    } else { alert("غلط پاس ورڈ!"); }
  };

  window.adminLogout = () => { currentAdmin = null; document.body.classList.remove("is-super-admin"); showTab('home'); };

  window.openCategory = (cat) => {
    currentCategory = cat;
    document.getElementById("catHeaderTitle").textContent = cat;
    renderProducts(); showTab("categoryDetail");
  };

  function renderProducts() {
    const list = document.getElementById("productList"); list.innerHTML = "";
    const items = CATALOG[currentCategory] || [];
    if (items.length === 0) { list.innerHTML = `<div style="grid-column:1/-1; text-align:center;">کوئی آئٹم نہیں</div>`; return; }
    
    items.forEach((p, i) => {
      const div = document.createElement("div"); div.className = "product-item";
      div.innerHTML = `
        <button class="delete-prod-btn admin-only" onclick="deleteProduct('${currentCategory}', ${i})">🗑️</button>
        <div class="product-img-box"><img src="${p.images[0] || ''}"></div>
        <div class="product-info"><h4>${p.name}</h4><span class="price">${p.price} روپے</span></div>`;
      list.appendChild(div);
    });
  }

  window.deleteProduct = (cat, index) => {
    if(confirm("ڈیلیٹ کریں؟")) {
      CATALOG[cat].splice(index, 1);
      saveToSupabase(); renderProducts();
    }
  };

  window.openAddProductModal = () => document.getElementById("addProductForm").style.display = "block";
  window.closeAddProductModal = () => document.getElementById("addProductForm").style.display = "none";

  document.getElementById("addProductForm").addEventListener("submit", async e => {
    e.preventDefault();
    const cat = currentCategory;
    const name = document.getElementById("prodName").value;
    const price = document.getElementById("prodPrice").value;
    const file = document.getElementById("prodImg1").files[0];
    
    let imgData = "";
    if (file) imgData = await compressImage(file);

    CATALOG[cat].push({ name, price, images: [imgData] });
    await saveToSupabase();
    renderProducts(); closeAddProductModal(); alert("✅ شامل!");
  });

  window.showEmpLogin = () => alert("یہ فیچر جلد آ رہا ہے");

  window.addEventListener('load', () => { loadFromSupabase(); });
});
</script>
</body>
</html>
